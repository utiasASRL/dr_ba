map:
  voxel_res: 1.0  # m
output:
  output_path: '/home/dl/Documents/phd/dev/dr_ba/output/ba_results'
  visualize: false
  save_result: true
input:
  data_path: '/home/dl/Documents/phd/data/boreas'
  meas_path: '/home/dl/Documents/phd/dev/dr_ba/output'
  seq_id: 'boreas-2024-12-04-11-45' # skyway
  max_dist: 80.0  # m
  dist_field_preproc: True
  adaptive_blur: true # adaptively choose Gaussian blur sigma based on scan content
  gauss_blur_sigma: 3.0  # pixels
  min_int_val_tol: 0.1 # min intensity value to consider a non-zero pixel
  min_percent_nonzero: 3.0 # Minimum percent of scan pixels above min_int_val_tol to stop blurring scan
  init_poses: 'gt'  # 'pogo' or 'gt', 'dro'
  init_translation_std: 0.0  # m
  init_rotation_std: 0.0  # degrees
