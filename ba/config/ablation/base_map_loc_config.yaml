keyframing:
  max_kf_dist: 10.0  # m
  max_kf_rot: 30.0  # degrees
  fix_first_scan: true
optimization:
  num_threads: 16
  max_iterations: 40
  convergence_tol: 1e-3
  alpha: 1.0  # step size
  adaptive_alpha: false # decrease alpha if cost does not decrease
  meas_std: 0.1 # intensity units
  range_factor: 0.02  # factor to scale range uncertainty to intensity uncertainty
  use_cumul_thresh: true
  zero_thresh: 0.1 # max cumul return threshold to consider a measurement as zero return
  cumul_thresh: 0.9  # threshold to ignore measurements with too high a cumulative return
  rel_pose_prior:
    use_pose_prior: false
